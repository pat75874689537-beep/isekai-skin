<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISEKAI — สตูดิโอแปลงสกินเป็นแอดออน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
<!-- คาตาคานะ イセカイ: โหลดเฉพาะ 4 ตัวอักษรที่ใช้ (text=) ไฟล์เล็กมาก -->
<link href="https://fonts.googleapis.com/css2?family=Tourney:ital,wght@1,900&family=Saira+Stencil+One&family=Orbitron:wght@900&text=ISEKAI&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&text=%E3%82%A4%E3%82%BB%E3%82%AB%E3%82%A4&display=swap" rel="stylesheet">
<!-- ไลบรารี: JSZip (ทำไฟล์ zip) + three.js (วาดโมเดล 3 มิติจากไฟล์ geometry จริงที่จะใส่ในแอดออน) -->
<!-- integrity = ลายนิ้วมือไฟล์: ถ้าไฟล์บน CDN ถูกแก้ เบราว์เซอร์จะไม่ยอมรัน (กันโค้ดแปลกปลอม) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  /* =====================================================================
     ISEKAI — ธีมไซเบอร์แบบ "แผงควบคุมโลกอื่น"
     สีหมึกน้ำเงินเข้ม + เส้นฟ้าน้ำแข็ง + ส้มสัญญาณ (ใช้กับปุ่มหลัก/สถานะเสร็จเท่านั้น)
     ตัว ISEKAI แบบหนาแคบ + คาตาคานะแนวตั้ง • ราวขั้นตอนด้านซ้ายที่ติดไฟตามความคืบหน้าจริง
     ===================================================================== */
  :root{
    --ink:#0A0B14;          /* พื้นหลัก */
    --ink2:#11121E;         /* พื้นแผง */
    --ink3:#07080E;         /* ช่องกรอก/ของในแผง */
    --ice:#8AF8FF;          /* เส้น ตัวเน้น */
    --sig:#F3E600;          /* เหลืองป้าย: ปุ่มหลัก + ขั้นที่เสร็จ + หัวแผง */
    --text:#E6EEF9; --dim:#8D9BBA;
    --line:var(--ice); --lineDim:rgba(95,246,255,.16); --win2:var(--ink3);
    --gold:var(--sig); --cyan:var(--ice);
    --ok:#6EF0B0; --bad:#FF4D5E; --warn:#FFC24B; --amber:var(--warn);
    --f:"Chakra Petch",system-ui,sans-serif;
    --disp:"Big Shoulders Display","Chakra Petch",sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;color:var(--text);font-family:var(--f);font-size:16px;line-height:1.6;min-height:100vh;background-color:var(--ink);
       background-image:
         radial-gradient(1100px 620px at 85% -12%,rgba(255,43,214,.10),transparent 65%),
         radial-gradient(900px 600px at -10% 30%,rgba(95,246,255,.07),transparent 70%),
         url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'><g fill='none' stroke='%235FF6FF' stroke-opacity='.07' stroke-width='1'><path d='M0 54h48l14 14h52M114 68v44l14 14h92M26 220v-50l18-18h30M164 0v30l-14 14H96M190 220v-34l-10-10h-46l-12-12v-30'/><path d='M0 164h36M78 0v22M220 92h-38l-10 10'/></g><g fill='%235FF6FF' fill-opacity='.16'><rect x='112' y='66' width='4' height='4'/><rect x='72' y='150' width='4' height='4'/><rect x='94' y='42' width='4' height='4'/><rect x='120' y='132' width='4' height='4'/></g><g fill='%23FF2BD6' fill-opacity='.35'><rect x='34' y='162' width='4' height='4'/><rect x='170' y='100' width='4' height='4'/></g></svg>"),
         radial-gradient(rgba(95,246,255,.10) 1px,transparent 1.2px);
       background-size:auto,auto,220px 220px,18px 18px}
  ::selection{background:var(--sig);color:var(--ink)}
  .wrap{position:relative;max-width:1180px;margin:0 auto;padding:10px 18px 72px}

  /* ===== หัวเว็บ ===== */
  .hero{position:relative;display:grid;grid-template-columns:1fr;align-items:end;gap:6px 32px;padding:34px 0 26px;margin-bottom:6px;border-bottom:1px solid var(--lineDim)}
  @media(min-width:900px){ .hero{grid-template-columns:auto 1fr;padding:48px 0 30px} }
  .word{margin:0;font-family:var(--disp);font-weight:900;font-size:clamp(76px,21vw,176px);line-height:.82;letter-spacing:.01em;color:var(--ice);
        position:relative;padding-bottom:10px}
  /* ขีดส้มใต้ตัวอักษร ยาวไม่เท่าคำ (ตั้งใจให้ไม่สมมาตร) */
  .word::after{content:"";position:absolute;left:4px;bottom:0;width:38%;height:6px;background:var(--sig)}
  .heroText{max-width:30em;padding-bottom:6px}
  .tag{margin:0;font-size:clamp(18px,2.4vw,22px);font-weight:600;line-height:1.35}
  .sub{margin:6px 0 0;color:var(--dim);font-size:15px}
  .kana{position:absolute;right:0;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;white-space:nowrap;font-family:"Noto Sans JP",sans-serif;font-weight:900;
        font-size:clamp(30px,4.4vw,50px);line-height:1;letter-spacing:.08em;color:transparent;-webkit-text-stroke:1px rgba(95,246,255,.28);
        pointer-events:none;user-select:none}
  @media(max-width:899px){ .kana{font-size:34px;top:40px;transform:none} }
  .heroText{padding-right:64px}

  /* ===== ผังหน้า ===== */
  .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:22px}
  @media(min-width:900px){ .layout{grid-template-columns:420px minmax(0,1fr);align-items:start} .stageCol{position:sticky;top:18px} }

  /* ===== ราวขั้นตอน: เส้นแนวตั้ง + จุดเลขขั้น ติดไฟส้มเมื่อขั้นนั้นเสร็จจริง ===== */
  .steps{position:relative;display:flex;flex-direction:column;gap:20px;padding-left:46px;counter-reset:step}
  .steps::before{content:"";position:absolute;left:16px;top:24px;bottom:24px;width:2px;
        background:linear-gradient(var(--lineDim),var(--lineDim)) 0 0/2px 100% no-repeat}
  .steps > .win:not(.hidden){counter-increment:step}
  .steps > .win::before{content:counter(step);position:absolute;left:-46px;top:16px;width:34px;height:34px;display:grid;place-items:center;
        font-family:var(--disp);font-weight:900;font-size:18px;color:var(--ice);background:var(--ink);border:2px solid var(--lineDim);border-radius:50%;
        transition:background .4s var(--ease),border-color .4s var(--ease),color .4s var(--ease),box-shadow .4s var(--ease)}
  .steps > .win.done::before{background:var(--sig);border-color:var(--sig);color:var(--ink);box-shadow:0 0 0 5px rgba(243,230,0,.16)}
  @media(max-width:560px){ .steps{padding-left:38px} .steps::before{left:13px} .steps > .win::before{left:-38px;width:28px;height:28px;font-size:15px} }

  /* ===== แผง: เรียบ เส้นบาง หัวแผงคั่นด้วยเส้น — ไม่ใช่การ์ดซ้ำแบบเดียวกันทั้งหน้า ===== */
  .win,.card{position:relative;background:linear-gradient(180deg,rgba(18,23,49,.92),rgba(14,18,38,.92));border:1px solid var(--lineDim);border-radius:3px;
        padding:18px 20px 20px;transition:border-color .3s var(--ease)}
  .win:focus-within{border-color:rgba(95,246,255,.4)}
  .card h2,.win h2{margin:-2px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--lineDim);font-size:21px;font-weight:600;line-height:1.3;
        display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .num{display:none}
  /* แผงสร้างแอดออน: แถบลายเตือนส้มที่ขอบบนแผงเดียว (เป็นจุดที่ต้องกด) */
  #winBuild{border-top:0;padding-top:24px}
  #winBuild::after{content:"";position:absolute;left:-1px;right:-1px;top:0;height:5px;
        background:repeating-linear-gradient(-45deg,var(--sig) 0 9px,transparent 9px 18px);opacity:.85}

  label{display:block;font-size:14px;color:var(--dim);margin:12px 0 5px}
  input[type=text],select{width:100%;padding:11px 12px;border:1px solid var(--lineDim);border-radius:2px;background:var(--ink3);color:var(--text);
        font:inherit;font-size:16px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
  input[type=text]:hover,select:hover{border-color:rgba(95,246,255,.32)}
  input[type=text]:focus-visible,select:focus-visible{outline:none;border-color:var(--sig);box-shadow:0 0 0 3px rgba(243,230,0,.22)}
  button:focus-visible,.btn:focus-visible,label.drop:focus-within{outline:2px solid var(--sig);outline-offset:3px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}

  /* ปุ่ม: ส้ม = การกระทำหลักอันเดียว, ปุ่มรองเป็นเส้น */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border:1px solid var(--sig);border-radius:2px;
       font:inherit;font-size:16px;font-weight:600;cursor:pointer;color:var(--ink);background:var(--sig);
       transition:transform .15s var(--ease),filter .2s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--lineDim);font-weight:500}
  @media (hover:hover){ .btn:hover{filter:brightness(1.08)} .btn.ghost:hover{border-color:var(--ice);color:var(--ice)} }
  .btn.small{padding:7px 12px;font-size:14px}
  .btn.full{width:100%;font-size:19px;padding:16px;letter-spacing:.02em}

  /* ช่องเลือกไฟล์ */
  label.drop{position:relative;display:block;margin:0;padding:26px 16px;text-align:center;color:var(--text);cursor:pointer;border-radius:2px;
       background:repeating-linear-gradient(-45deg,rgba(95,246,255,.03) 0 10px,transparent 10px 20px),var(--ink3);
       border:1px dashed rgba(95,246,255,.35);transition:border-color .25s var(--ease),background-color .25s var(--ease)}
  @media (hover:hover){ label.drop:hover{border-color:var(--ice)} }
  label.drop.over{border-color:var(--sig)}
  label.drop b{color:var(--ice);font-weight:600}
  .drop .big{display:block;font-size:18px;font-weight:600;margin-bottom:4px}
  .vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
  .hidden{display:none !important}

  /* ===== เวทีโฮโลแกรม ===== */
  .viewer{position:relative;height:470px;overflow:hidden;touch-action:none;border-radius:3px;border:1px solid var(--lineDim);
          background:
            radial-gradient(ellipse 55% 14% at 50% 78%,rgba(255,43,214,.16),transparent 70%),
            linear-gradient(rgba(95,246,255,.05) 1px,transparent 1px) 0 0/100% 26px,
            linear-gradient(90deg,rgba(95,246,255,.05) 1px,transparent 1px) 0 0/26px 100%,
            linear-gradient(180deg,#10163A,#070912)}
  @media(max-width:899px){.viewer{height:400px}}
  .viewer canvas{position:relative;z-index:1;display:block;width:100%;height:100%}
  .viewer::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
          background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
  /* จุดกลางแท่น = ตำแหน่งเท้าตัวละคร (ราว 22% จากขอบล่าง เหนือแถวปุ่ม) */
  .circle{position:absolute;left:50%;bottom:22%;width:min(94%,390px);aspect-ratio:1;transform:translate(-50%,50%) rotateX(72deg);z-index:0;pointer-events:none}
  .circle svg{width:100%;height:100%}
  .circle .spinA{transform-origin:100px 100px;animation:spin 46s linear infinite}
  .circle .spinB{transform-origin:100px 100px;animation:spin 80s linear infinite reverse}
  .circle.summon svg{animation:flash 1.4s var(--ease)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes flash{0%{filter:none}20%{filter:drop-shadow(0 0 16px #FF2BD6) brightness(1.9)}100%{filter:none}}
  .viewer .tag{position:absolute;z-index:3;left:14px;top:12px;font-size:15px;font-weight:600;color:var(--text);pointer-events:none;
               padding:0 0 0 10px;border-left:3px solid var(--sig)}
  .viewer .empty{position:absolute;z-index:3;left:0;right:0;top:24%;color:var(--dim);font-size:15px;text-align:center;padding:0 24px}
  .hud{position:absolute;z-index:3;right:14px;top:12px;font-size:12px;color:var(--dim);text-align:right;line-height:1.5;pointer-events:none}
  .hud span{color:var(--ice)}
  .vbtns{position:absolute;z-index:3;left:8px;right:8px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .vbtns .btn{background:rgba(7,9,18,.8)}
  .stageNote{margin:10px 2px 0}

  /* ===== รายการสกิน ===== */
  .list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .skin{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:start;padding:10px;cursor:pointer;border-radius:2px;
        background:var(--ink3);border:1px solid var(--lineDim);transition:border-color .25s var(--ease),box-shadow .25s var(--ease),transform .2s var(--ease)}
  @media (hover:hover){ .skin:hover{border-color:rgba(95,246,255,.34)} }
  .skin.sel{border-color:rgba(243,230,0,.6);box-shadow:inset 3px 0 0 var(--sig)}
  .skin canvas{width:60px;height:60px;background:#18204A;border-radius:2px}
  .skin input[type=text]{padding:8px 10px;font-size:15px}
  .skin select{padding:6px 8px;font-size:14px;margin-top:6px}
  .skin .meta{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.55}
  .skin .meta b{color:var(--ice);font-weight:500}
  .skin .x{background:none;border:0;color:var(--dim);font-size:20px;cursor:pointer;padding:2px 8px;line-height:1;transition:color .2s}
  .skin .x:hover{color:var(--bad)}
  .note{font-size:14px;color:var(--dim);line-height:1.6}
  .msg{margin-top:12px;padding:10px 12px;font-size:15px;display:none;line-height:1.65;word-break:break-word;border-left:3px solid;border-radius:2px}
  .msg.ok{display:block;background:rgba(110,240,176,.07);border-color:var(--ok)}
  .msg.err{display:block;background:rgba(255,77,94,.08);border-color:var(--bad)}
  .msg.warn{display:block;background:rgba(255,194,75,.08);border-color:var(--warn)}
  details{border-top:1px solid var(--lineDim);padding:12px 2px 2px;margin-top:16px}
  summary{cursor:pointer;font-weight:600;list-style-position:outside}
  details ol,details ul{margin:8px 0 4px 0;padding-left:22px;line-height:1.8;font-size:15px}
  code{background:rgba(95,246,255,.09);padding:1px 6px;color:var(--ice);word-break:break-all;font-size:.92em;border-radius:2px}
  footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#5A6789;font-size:13px;margin-top:44px;padding-top:16px;border-top:1px solid var(--lineDim)}
  footer .mark{font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:.04em;color:var(--dim)}

  /* =====================================================================
     การเคลื่อนไหว — นุ่ม ช้า ใช้แค่ transform/opacity/clip-path
     เปิดหน้า: ตัว ISEKAI ค่อยๆ เผยจากซ้าย → ขีดส้มลากตาม → ส่วนอื่นค่อยๆ ขึ้น (ครั้งเดียว)
     ===================================================================== */
  .flow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .flow .pulse{fill:none;stroke:#5FF6FF;stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linecap:round;
               stroke-dasharray:5 140;opacity:.35;animation:run 14s linear infinite}
  .flow .p1{stroke:#FF2BD6;opacity:.45;animation-duration:18s}
  .flow .p2{animation-duration:11s;opacity:.22}
  @keyframes run{from{stroke-dashoffset:145}to{stroke-dashoffset:0}}
  .wrap{z-index:1}

  .word{animation:reveal 1.1s var(--ease) both}
  @keyframes reveal{from{clip-path:inset(0 100% 0 0);transform:translateX(-14px)}to{clip-path:inset(0 0 0 0);transform:none}}
  .word::after{transform-origin:left;animation:grow .8s .7s var(--ease) both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .kana{animation:fade 1.6s .5s var(--ease) both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .heroText{animation:rise .8s .55s var(--ease) both}
  .stageCol{animation:rise .9s .7s var(--ease) both}
  .steps > .win{animation:rise .8s var(--ease) both}
  .steps > .win:nth-child(1){animation-delay:.8s} .steps > .win:nth-child(2){animation-delay:.9s}
  .steps > .win:nth-child(3){animation-delay:1s} .steps > .win:nth-child(4){animation-delay:1.1s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .steps::before{transform-origin:top;animation:line 1.2s .8s var(--ease) both}
  @keyframes line{from{transform:scaleY(0)}to{transform:scaleY(1)}}

  /* เวที: ลำแสงสแกนกวาดขึ้นช้าๆ + อนุภาคลอย + คลื่นจากแท่น */
  .viewer .beam{position:absolute;z-index:2;left:0;right:0;height:46px;bottom:0;pointer-events:none;
         background:linear-gradient(0deg,transparent,rgba(95,246,255,.04) 55%,rgba(200,252,255,.26) 97%,transparent);
         mix-blend-mode:screen;animation:scan 6.5s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes scan{0%{transform:translateY(0);opacity:0}12%{opacity:1}78%{opacity:.8}100%{transform:translateY(-470px);opacity:0}}
  .viewer .motes{position:absolute;inset:0;z-index:1;pointer-events:none}
  .viewer .motes i{position:absolute;bottom:22%;width:2px;height:2px;border-radius:50%;background:#D8FCFF;box-shadow:0 0 6px #5FF6FF;
         animation:mote 6s linear infinite;opacity:0}
  .viewer .motes i:nth-child(4n){background:#FF6BE2;box-shadow:0 0 6px #FF2BD6}
  @keyframes mote{0%{transform:translateY(0);opacity:0}20%{opacity:.85}100%{transform:translateY(-230px);opacity:0}}
  .circle .ripple{transform-origin:100px 100px;animation:ripple 4.2s var(--ease) infinite}
  @keyframes ripple{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.3);opacity:0}}

  /* แผงฟังชั่นโผล่ขึ้นนุ่มๆ ตอนเลือกสกิน */
  #fxCard:not(.hidden){animation:rise .5s var(--ease) both}

  /* ปุ่มสร้าง: ระหว่างสร้างเป็นแถบลายวิ่ง */
  .btn.full.busy{background:repeating-linear-gradient(-45deg,var(--sig) 0 14px,#C9BE00 14px 28px);background-size:40px 40px;animation:stripes .7s linear infinite}
  @keyframes stripes{to{background-position:40px 0}}
  .msg.ok,.msg.err,.msg.warn{animation:slideIn .35s var(--ease)}
  @keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none !important;transition:none !important}
    .flow,.viewer .beam,.viewer .motes{display:none}
  }
